name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# A new push supersedes whatever the previous one was still checking.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typechecks and bundles, so a break in either shows up here rather than
      # at release time, when the tag has already been pushed.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Smoke test
        run: npm run smoke -- tests/fixtures/sample.pptx
