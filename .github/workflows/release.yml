name: Release

on:
  push:
    tags:
      # Release tags are the bare version, with no `v`, because Obsidian expects
      # the tag to match the manifest. Anything else is not a release.
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # versions.json is the file Obsidian reads to decide whether a vault is
      # new enough for this build, so a missing entry breaks updates quietly.
      - name: Verify version
        run: |
          test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
          test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
          test "$(node -p "require('./versions.json')['${GITHUB_REF_NAME}'] ?? ''")" \
             = "$(node -p "require('./manifest.json').minAppVersion")"

      - name: Build
        run: npm run build

      # The tagged commit is not necessarily one CI has seen, so the checks run
      # again here rather than being taken on trust.
      - name: Unit tests
        run: npm test

      - name: Smoke test
        run: npm run smoke -- tests/fixtures/sample.pptx

      - name: Create release
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
