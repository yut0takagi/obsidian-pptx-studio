name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version
        run: |
          test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
          test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke -- tests/fixtures/sample.pptx

      - name: Create release
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
