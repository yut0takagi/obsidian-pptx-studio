name: Release

on:
  push:
    tags:
      # Release tags are the bare version, with no `v`, because Obsidian expects
      # the tag to match the manifest. Anything else is not a release.
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  attestations: write
  id-token: write

# Two tags pushed close together would otherwise race each other to create a
# release. Nothing here is cancelled: a half-published release is worse than a
# slow one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to a commit, because a tag can be moved
      # to point at something else. The comment says which release it was.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # versions.json is the file Obsidian reads to decide whether a vault is
      # new enough for this build, so a missing entry breaks updates quietly.
      - name: Verify version
        run: |
          test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
          test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
          test "$(node -p "require('./versions.json')['${GITHUB_REF_NAME}'] ?? ''")" \
             = "$(node -p "require('./manifest.json').minAppVersion")"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The tagged commit is not necessarily one CI has seen, so the checks run
      # again here rather than being taken on trust.
      - name: Unit tests
        run: npm test

      - name: Smoke test
        run: npm run smoke -- tests/fixtures/sample.pptx

      # --generate-notes lists the pull requests merged since the last release,
      # which is more use to someone deciding whether to update than the tag
      # repeated back at them.
      - name: Create release
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      # Every file the release ships, manifest.json included: it is what
      # Obsidian reads to decide what to install, so it is worth attesting.
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
